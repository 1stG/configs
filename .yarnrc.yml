enableTelemetry: false

nodeLinker: node-modules

# `changeset publish` shells out to `yarn npm publish`, so provenance for every
# published package is enabled here rather than per package
npmPublishProvenance: true

# Oxfmt is published frequently; keep Renovate updates installable before the
# default one-day age gate (including third-party actions that run yarn install).
npmPreapprovedPackages:
  - oxfmt
  - '@oxfmt/*'

plugins:
  - checksum: 37b2361b1502b2054e6779788c0e9bdd6a90ce49852a8cad2feda79b0614ec94f06fb6e78951f5f95429c610d7934dd077caa47413a0227378a102c55161616d
    path: .yarn/plugins/plugin-prepare-lifecycle.cjs
    spec: 'https://github.com/un-es/yarn-plugin-prepare-lifecycle/releases/download/v0.0.1/index.js'

yarnPath: .yarn/releases/yarn-4.18.1.cjs
